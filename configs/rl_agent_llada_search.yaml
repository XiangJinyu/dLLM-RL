##############################################################################
# Agent RL config: LLaDA + Search QA (e.g., HotpotQA)
#
# Usage:
#   python rl_agent.py config=configs/rl_agent_llada_search.yaml
#
# This config trains a search-augmented QA agent using LLaDA.
# The agent can search a knowledge base to answer multi-hop questions.
##############################################################################

wandb:
  entity: null
  resume: 'auto'


experiment:
    project: "rl_agent_llada_search"
    function: "train"
    start_from_scratch: True
    total_step: 50
    save_every: 10
    eval_every: 10
    current_epoch: 1
    deepspeed_file: "1_node_1_gpus_deepspeed_zero3"
    num_node: 1
    node_index: 0

model:
    pretrained_model: "/abs/path/of/model"
    optimized_name: "optimized"
    model_base: "llada"

dataset:
    train_dataset: "HotpotQA_train"
    optimization_data: "rl_agent_search_data"
    data_type: "agent"

agent:
    max_turns: 6
    max_tokens_per_turn: 384
    max_total_tokens: 4096
    reward_mode: "turn_level"   # use turn-level rewards for search tasks
    
    env_class: "agent.envs.search_qa_env.SearchQAEnv"
    env_kwargs:
        use_turn_rewards: True
    
    tools:
        - class: "agent.tools.search_tool.SearchTool"
          backend: "wikipedia"   # or "mock" for offline training
          top_k: 3
          max_chars: 500

rollout:
    num_task_per_step: 32
    num_response_per_task: 8
    temperature: 0.8
    steps: 384
    max_gen_length: 384
    batch_size: 1
    remasking_strategy: "low_confidence_static"
    target: "confidence"
    dynamic_threshold: 0.95
    block_size: 32
    further_horizon: 128
    use_cache: True

execute:
    num_chunk: 128

training:
    gradient_accumulation_steps: 128
    batch_size_lm: 2
    mixed_precision: "bf16"
    enable_tf32: True
    seed: 10086
    num_train_epochs: 1
    max_grad_norm: 1.0
    method: "TraceRL"
    lower_p: 0.1
    upper_p: 0.9
    shrink: 8
    post_num: 0
    mask_times_per_sample: 35
    max_gen_length: ${agent.max_total_tokens}
    max_prompt_len: 1024
    eps: 0.20
    beta: 0.01
    use_kl_estimator_k3: True

optimizer:
    name: adamw
    params:
        learning_rate: 1e-6
        scale_lr: False
        beta1: 0.9
        beta2: 0.999
        weight_decay: 0.0
        epsilon: 1e-8

lr_scheduler:
    scheduler: "cosine"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 0
        min_lr_scale: 1.0

evaluation:
    eval_dataset: "HotpotQA_eval"
    data_type: "agent"
    num_response_per_task: 3
    temperature: 0.1
    steps: 384
    max_gen_length: 384
    batch_size: 1
    remasking_strategy: ["low_confidence_static"]
    target: "confidence"
    dynamic_threshold: 0.95
    block_size: 32
    further_horizon: 128
    use_cache: True
