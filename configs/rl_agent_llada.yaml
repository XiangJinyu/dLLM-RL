##############################################################################
# Agent RL training config for LLaDA with multi-turn tool calling
#
# Usage:
#   python rl_agent.py config=configs/rl_agent_llada.yaml
#
# This config extends the standard rl_llada.yaml with agent-specific
# parameters for multi-turn interaction, tool definitions, and
# environment configuration.
##############################################################################

wandb:
  entity: null
  resume: 'auto'


experiment:
    project: "rl_agent_llada"   # must match this filename
    function: "train"
    start_from_scratch: True
    total_step: 50
    save_every: 10
    eval_every: 10
    current_epoch: 1
    deepspeed_file: "1_node_1_gpus_deepspeed_zero3"
    num_node: 1
    node_index: 0

model:
    pretrained_model: "/abs/path/of/model"   # absolute path of your LLaDA model
    optimized_name: "optimized"
    model_base: "llada"

dataset:
    train_dataset: "dataset_name"   # "MATH_train", "HotpotQA_train", etc.
    optimization_data: "rl_agent_data"
    data_type: "agent"   # new data type for agent tasks

# ── Agent Configuration ──────────────────────────────────────────
# This section defines the agent's tools, environment, and interaction params.
agent:
    # Maximum number of interaction turns (generate -> tool -> observe -> ...)
    max_turns: 5
    # Maximum tokens generated per turn
    max_tokens_per_turn: 512
    # Maximum total tokens (prompt + all turns combined)
    max_total_tokens: 4096
    
    # Reward mode: "trajectory" (same reward for all tokens) or 
    # "turn_level" (per-turn rewards for fine-grained credit assignment)
    reward_mode: "trajectory"
    
    # Environment class (full Python import path)
    env_class: "agent.envs.math_tool_env.MathToolEnv"
    
    # Additional keyword arguments for the environment constructor
    env_kwargs:
        use_turn_rewards: False
    
    # Tool definitions -- list of tool classes to make available
    # Each can be a string (class path) or dict with class + kwargs
    tools:
        - class: "agent.tools.calculator_tool.CalculatorTool"
        - class: "agent.tools.python_tool.PythonExecuteTool"
          timeout: 10
          max_output_chars: 2000


# ── Rollout Configuration ────────────────────────────────────────
# Most params are inherited from the standard LLaDA config.
# key difference: generation is per-turn, not per-response.
rollout:
    num_task_per_step: 32
    num_response_per_task: 8    # trajectories per task
    temperature: 0.8
    steps: 512
    max_gen_length: 512         # per-turn generation length
    batch_size: 1               # agent rollout is sequential per-task
    remasking_strategy: "low_confidence_static"
    target: "confidence"
    dynamic_threshold: 0.95
    block_size: 32
    further_horizon: 128
    use_cache: True

execute:
    num_chunk: 128

# ── Training Configuration ───────────────────────────────────────
# Same PPO-clip objective, but with segment-aware masking
training:
    gradient_accumulation_steps: 128
    batch_size_lm: 2
    mixed_precision: "bf16"
    enable_tf32: True
    seed: 10086
    num_train_epochs: 1
    max_grad_norm: 1.0
    method: "TraceRL"           # "random_masking" "TraceRL" "coupled"
    lower_p: 0.1
    upper_p: 0.9
    shrink: 8
    post_num: 0
    mask_times_per_sample: 35
    max_gen_length: ${agent.max_total_tokens}   # total budget for agent
    max_prompt_len: 1024        # agent prompts are longer (include tool descriptions)
    eps: 0.20
    beta: 0.01
    use_kl_estimator_k3: True

optimizer:
    name: adamw
    params:
        learning_rate: 1e-6
        scale_lr: False
        beta1: 0.9
        beta2: 0.999
        weight_decay: 0.0
        epsilon: 1e-8

lr_scheduler:
    scheduler: "cosine"
    params:
        learning_rate: ${optimizer.params.learning_rate}
        warmup_steps: 0
        min_lr_scale: 1.0

evaluation:
    eval_dataset: "MATH500"
    data_type: "math"
    num_response_per_task: 3
    temperature: 0.1
    steps: 512
    max_gen_length: 512
    batch_size: 1
    remasking_strategy: ["low_confidence_static"]
    target: "confidence"
    dynamic_threshold: 0.95
    block_size: 32
    further_horizon: 128
    use_cache: True
